<section class="almond" aria-labelledby="almond-title">

  <div class="section-top">
    <h2 id="almond-title">Ask Almond</h2>
    <span class="hint">Powered by Gemini</span>
  </div>

  <p>
    Your FitNut AI companion for meals,
    workouts, nutrition and fitness questions.
  </p>

  <form id="almond-form">

    <label for="almond-question">
      What would you like help with?
    </label>

    <textarea
      id="almond-question"
      name="question"
      rows="3"
      maxlength="1000"
      required
      placeholder="Ask about meals, workouts, or nutrition..."
    ></textarea>

    <div class="almond-actions">
      <button
        class="button"
        type="submit"
        id="almond-submit"
      >
        Ask Almond
      </button>
    </div>

  </form>

  <div
    id="almond-response"
    role="status"
    aria-live="polite"
    hidden
  >
    <h3>Almond says</h3>
    <p id="almond-answer"></p>
  </div>

</section>

<script
  src="{{ url_for('static', filename='almond.js') }}"
  defer
></script>
